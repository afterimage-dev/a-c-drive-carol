<title>A C-Drive Carol Trailer</title>
<style>
/* Layout: a cinema screen and a slim transport bar beneath it. Single dark world by design. */
:root { color-scheme: dark; --void: #050408; --ink: #e9e6f5; --dim: #948fae; --spectre: #8ff0ee; --rule: #2a2640;
  --mono: "JBMono", ui-monospace, Consolas, monospace; --body: "Atkinson", system-ui, sans-serif; --display: "Fell", Georgia, serif; }
html, body { background: var(--void); color: var(--ink); }
body { font-family: var(--body); margin: 0 auto; max-width: 1280px; padding-inline: 16px; padding-block: 16px 28px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-block-end: 10px; }
.head h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 4vw, 2rem); margin: 0; }
.head p { margin: 0; color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.screen { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--rule); }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.play { position: absolute; left: 50%; top: 50%; translate: -50% -50%; font-family: var(--mono); font-size: 14px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink); background: rgba(5, 4, 8, .72); border: 1px solid rgba(143, 240, 238, .5); border-radius: 999px; padding: 14px 26px; cursor: pointer; }
.play:hover { border-color: var(--spectre); color: var(--spectre); }
.play:focus-visible, .bar button:focus-visible, .bar input:focus-visible { outline: 2px solid var(--spectre); outline-offset: 2px; }
.bar { display: flex; align-items: center; gap: 12px; margin-block-start: 10px; }
.bar button { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.bar input { flex: 1; min-width: 0; accent-color: var(--spectre); }
.bar output { font-family: var(--mono); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.note { color: var(--dim); font-size: 13px; margin: 10px 0 0; }
.err { color: #ffb3c7; font-family: var(--mono); font-size: 12px; }
</style>

<div class="head"><h1>A C-Drive Carol</h1><p>Trailer · 1:51 · sound on</p></div>
<div class="screen" id="screen">
  <canvas id="out" role="img" aria-label="Trailer for A C-Drive Carol: a haunted desktop, the ghost of Jacob Marlware, three spirits, and a gravestone for a hard drive"></canvas>
  <button class="play" id="play" type="button">Play trailer</button>
</div>
<div class="bar">
  <button id="toggle" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="110.8" step="0.01" value="97.3" aria-label="Position in the trailer">
  <output id="clock">1:37</output>
</div>
<p class="note">Made with the app's own art, fonts and animation code. Flashing images and a loud moment at 1:21.</p>

<script src="__PIXI__"></script>

<script>
(async function () {
  const MODE = "__MODE__";                 // "live" (player page) or "render" (frame capture)

  const shotAt = (t) => TL.shots.find((s) => t >= s.start && t < s.end) || TL.shots[TL.shots.length - 1];
  const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

  // ---------- canvases ----------
  const out = document.getElementById("out");
  let Q = 1;

  // ---------- images ----------
  const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const IMG = {};
  await Promise.all(Object.entries(A).filter(([k, v]) => typeof v === "string").map(async ([k, v]) => { IMG[k] = await loadImg(v); }));

  // ---------- PixiJS (spirits, gravestone, chain) ----------
  const app = new PIXI.Application({ width: out.width, height: out.height, backgroundAlpha: 0, antialias: true, preserveDrawingBuffer: true, autoStart: false, resolution: 1 });

  const world = new PIXI.Container(); app.stage.addChild(world);

  app.stage.addChild(sys.output);
  sys.world.addChild(fxLayer);
  const spiritLayer = sys.spirits;
  function softTex(stops) { const c = mk(128, 128), g = c.getContext("2d"), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return PIXI.Texture.from(c); }
  const EYE = {
    cyan: { socket: softTex([[0, "rgba(16,22,40,.75)"], [0.75, "rgba(16,22,40,.55)"], [1, "rgba(16,22,40,0)"]]), halo: softTex([[0, "rgba(143,240,238,.55)"], [0.4, "rgba(143,240,238,.18)"], [1, "rgba(143,240,238,0)"]]), disc: softTex([[0, "#f2fffe"], [0.55, "#c4faf8"], [0.82, "#8ff0ee"], [1, "rgba(143,240,238,0)"]]) },

  function hideLinks(from = 0) { for (let i = from; i < linkSprites.length; i++) linkSprites[i].visible = false; }

  // ---------- 2D drawing helpers ----------
  const F = { fell: "Fell", fellI: "Fell", cinzel: "Cinzel", corm: "Cormorant", abril: "Abril", mono: "JBMono", plex: "Plex", atk: "Atkinson" };
  function setFont(c, px, fam, style = "normal", weight = "400") { c.font = `${style} ${weight} ${px}px "${fam}"`; }
  function wrapLines(c, text, maxW) {
    const words = text.split(" "), lines = []; let line = "";

    if (line) lines.push(line); return lines;
  }
  const GLYPHS = "#%&@$*/";
  function typed(c, text, x, y, { maxW = 1200, lh = 1.3, px = 40, n = 1e9, glitchSeed = -1, align = "left" } = {}) {
    const lines = wrapLines(c, text, maxW); let left = Math.floor(n);
    c.textAlign = align; c.textBaseline = "alphabetic";

          else { const c1 = 1.70158, c3 = c1 + 1, q = k - 1; const s = k >= 1 ? 1 : 0.35 + 0.65 * (1 + c3 * q * q * q + c1 * q * q); c.globalAlpha *= clamp(k * 3); c.translate(cx + wW / 2, cy - px * 0.35); c.scale(s, s); c.fillText(w, -wW / 2, px * 0.35); }

  function panel(c, x, y, w, h, border = "rgba(143,240,238,.35)", fill = "rgba(9,8,15,.86)") {

  }
  function fileIcon(c, x, y, s, ext, col) {

    c.fillStyle = "#d9a336"; c.beginPath(); c.roundRect(0, 0, 26, 14, 4); c.fill();

  }

    c.fillStyle = "#0b0b11"; c.fillText("THE CRYPT", cx + 3, top + 56); c.fillStyle = "rgba(205,240,245,.6)"; c.fillText("THE CRYPT", cx + 3, top + 54.5); c.letterSpacing = "0px";
    c.restore();
  }

  // ---------- the desktop ----------
  const ICONS = [
    { name: "Downloads", folder: true, col: 0, row: 0 },
    { name: "invoice_march (3).pdf", ext: "pdf", c: "#d64545", col: 0, row: 1 },
    { name: "report (1).pdf", ext: "pdf", c: "#d64545", col: 0, row: 2 },
    { name: "Copy of report.pdf", ext: "pdf", c: "#d64545", col: 0, row: 3 },

  const desk = mk(W, H), dctx = desk.getContext("2d");

  // ---------- live player ----------
  const playBtn = document.getElementById("play"), toggle = document.getElementById("toggle"), scrub = document.getElementById("scrub"), clock = document.getElementById("clock");
  const audio = new Audio(AUDIO); audio.preload = "auto";
  let playing = false, t0 = 0, clockStart = 0, lastT = -1, frameNo = 0;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function curT() { if (!playing) return t0; if (audio.readyState >= 2 && !audio.paused) return audio.currentTime; return t0 + (performance.now() - clockStart) / 1000; }
  function draw(t) {
    if (t < lastT - 0.05 || t - lastT > 0.5) { lastShot = null; }
    const dt = lastT < 0 ? 1 / FPS : clamp(t - lastT, 0, 0.1);
    render(t, dt || 1 / FPS, Math.floor(t * FPS)); lastT = t; frameNo++;
    scrub.value = t.toFixed(2); clock.textContent = fmt(t);
  }
  function loop() {
    if (!playing) return;
    const t = curT();
    if (t >= DUR) { pause(); t0 = 97.3; draw(t0); playBtn.hidden = false; playBtn.textContent = "Play again"; return; }
    draw(t); requestAnimationFrame(loop);
  }
  async function play() {
    playing = true; playBtn.hidden = true; toggle.textContent = "Pause";
    if (t0 >= DUR - 0.1 || t0 === 97.3 && !audio.currentTime) t0 = 0;
    audio.currentTime = t0; clockStart = performance.now();
    try { await audio.play(); } catch (e) {}
    lastT = -1; requestAnimationFrame(loop);
  }
  function pause() { t0 = curT(); playing = false; audio.pause(); toggle.textContent = "Play"; }
  playBtn.addEventListener("click", play);
  toggle.addEventListener("click", () => (playing ? pause() : play()));
  scrub.addEventListener("input", () => { t0 = +scrub.value; audio.currentTime = t0; clockStart = performance.now(); lastT = -1; if (!playing) draw(t0); });
  // poster: the title card, complete at rest
  for (let i = 0; i < 30; i++) render(96.3 + i / 30, 1 / 30, i);
  t0 = 97.3; draw(t0);
})();
</script>
